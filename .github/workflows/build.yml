# Build the Tiger evaluation image and push it to GHCR.
#
# amd64 is native; arm64 is emulated through QEMU, which is slow but needs no special runner.
# If the build time becomes annoying, split arm64 onto a native `ubuntu-24.04-arm` runner — they
# are free for public repositories.
name: Build image

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      bundle:
        description: "WebTigers/Tiger release to install (blank = newest)"
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Docker Hub is optional: until the credentials exist the build still runs and still publishes
    # to GHCR. A missing secret should not break the build, it should just publish one registry.
    env:
      HAS_HUB: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4

      # Which bundle goes in. Pinned explicitly so the image is reproducible and so the tag we
      # publish describes what is actually inside it, rather than "whatever was newest that day".
      - name: Resolve the Tiger bundle
        id: bundle
        run: |
          tag="${{ github.event.inputs.bundle }}"
          if [ -z "$tag" ]; then
            tag=$(curl -fsSL https://api.github.com/repos/WebTigers/Tiger/releases/latest | jq -r .tag_name)
          fi
          echo "tag=$tag"               >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}"       >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.HAS_HUB == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the tags
        id: tags
        env:
          VERSION: ${{ steps.bundle.outputs.version }}
        run: |
          tags="ghcr.io/webtigers/tiger:${VERSION},ghcr.io/webtigers/tiger:latest"
          if [ "${HAS_HUB}" = "true" ]; then
            tags="${tags},docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tiger:${VERSION}"
            tags="${tags},docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tiger:latest"
            echo "publishing to GHCR and Docker Hub"
          else
            echo "publishing to GHCR only (no Docker Hub credentials configured)"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TIGER_VERSION=${{ steps.bundle.outputs.tag }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Tiger (evaluation)
            org.opencontainers.image.description=Run Tiger on your desktop to try it out. Not for production.
            org.opencontainers.image.source=https://github.com/WebTigers/TigerDocker
            org.opencontainers.image.version=${{ steps.bundle.outputs.version }}
            org.opencontainers.image.licenses=BSD-3-Clause
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is only worth publishing if it actually comes up. Runs the amd64 image, waits for
      # Tiger to answer, and fails the build if it does not — the "render it, or it isn't tested"
      # rule applied to a container.
      - name: Smoke test (amd64)
        env:
          ADMIN_EMAIL: admin@example.com
          ADMIN_PW: smoke-test-password-9173
        run: |
          docker run -d --name tiger-smoke -p 8080:80 \
            -e TIGER_ADMIN_EMAIL="${ADMIN_EMAIL}" \
            -e TIGER_ADMIN_PASSWORD="${ADMIN_PW}" \
            ghcr.io/webtigers/tiger:${{ steps.bundle.outputs.version }}
          # First run downloads the bundle, extracts it and runs the whole migration chain, so give
          # it room. Progress is printed as it goes — a smoke test that only says "failed" after
          # five minutes of silence is barely better than no smoke test.
          for i in $(seq 1 300); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || true)
            if [ "$code" = "200" ]; then echo "Tiger answered 200 after ${i}s"; ok=1; break; fi
            if [ $((i % 30)) -eq 0 ]; then
              echo "--- ${i}s, still waiting (last code: ${code}) ---"
              docker logs tiger-smoke 2>&1 | tail -5
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' tiger-smoke 2>/dev/null)" != "true" ]; then
              echo "::error::the container exited"; break
            fi
            sleep 1
          done
          echo "=== container log ==="
          docker logs tiger-smoke 2>&1 | tail -60
          if [ "${ok:-0}" != "1" ]; then echo "::error::Tiger never answered 200"; exit 1; fi

          # A 200 is not proof Tiger is what answered. The ComingSoon holding page returns 200 for
          # every public URL, and for several builds that is exactly what this test was passing on.
          curl -s -o /tmp/home.html http://localhost:8080/
          if grep -q 'data-cs-skin' /tmp/home.html; then
            echo "::error::the ComingSoon holding page is serving, not Tiger"
            grep -o '<title>[^<]*' /tmp/home.html | head -1
            exit 1
          fi
          if ! grep -q 'Tiger is running' /tmp/home.html; then
            echo "::error::the home page is blank — an evaluator sees a white screen"
            echo "  body: $(sed -n 's/.*<main[^>]*>\(.*\)<\/main>.*/\1/p' /tmp/home.html | head -c 200)"
            exit 1
          fi
          echo "HOME OK — Tiger is serving a real page, not a holding page or a blank canvas"

          # The evaluator has to be able to get in. A one-time link beats a password they must carry.
          echo "=== one-time sign-in link ==="
          MAGIC=$(docker exec tiger-smoke tiger-login 2>/dev/null || true)
          if [ -z "${MAGIC}" ]; then echo "::error::tiger-login issued no link"; exit 1; fi
          echo "  ${MAGIC%%/auth/magic*}/auth/magic/... (${#MAGIC} chars)"
          mcode=$(curl -s -c /tmp/mjar -o /tmp/magic.html -w '%{http_code}' -L "${MAGIC}")
          echo "  following it -> HTTP ${mcode}  $(grep -o '<title>[^<]*' /tmp/magic.html | head -1)"
          if ! grep -qi 'Tiger Admin' /tmp/magic.html; then
            echo "::error::the magic link did not land in the Dashboard"; exit 1
          fi
          echo "MAGIC OK — the link signs you straight into the Dashboard"

          # Serving a page is not the same as being usable. A stale bundle once produced installs
          # that rendered the sign-in form perfectly and rejected every login — which a 200-on-/
          # check passes happily. So actually sign in, with the credentials the install created.
          echo "=== signing in as ${ADMIN_EMAIL} ==="
          code=$(curl -s -c /tmp/jar -o /tmp/login.json -w '%{http_code}' \
            -X POST http://localhost:8080/auth/login \
            -H 'Accept: application/json' \
            -H 'X-Requested-With: XMLHttpRequest' \
            --data-urlencode "identifier=${ADMIN_EMAIL}" \
            --data-urlencode "password=${ADMIN_PW}")
          echo "  POST /auth/login -> HTTP ${code}"
          echo "  body: $(head -c 400 /tmp/login.json)"

          if ! grep -q '"result":1' /tmp/login.json; then
            echo "::error::login failed — the install is not usable"
            docker logs tiger-smoke 2>&1 | tail -30
            exit 1
          fi

          # And that the session is real: /admin must now render rather than bounce to sign-in.
          admin=$(curl -s -b /tmp/jar -o /tmp/admin.html -w '%{http_code}' http://localhost:8080/admin)
          echo "  GET /admin (signed in) -> HTTP ${admin}"
          if [ "${admin}" != "200" ]; then
            echo "::error::signed in, but /admin did not render (HTTP ${admin})"
            exit 1
          fi
          echo "  admin page title: $(grep -o '<title>[^<]*' /tmp/admin.html | head -1)"
          echo "LOGIN OK — a user can sign in to this image"

          # Signing in is not the same as being able to do anything. Create a CMS page through the
          # same /api the admin UI uses, then fetch it: saved-but-not-served is a real failure mode.
          echo "=== creating a CMS page ==="
          # /api is CSRF-protected with a per-form, timeout-lived _csrf token (Tiger_Form_Element_Hash),
          # so the token has to come from the very form being submitted — fetch the editor first,
          # exactly as a browser would.
          curl -s -b /tmp/jar -o /tmp/form.html -w '  GET /cms/page/edit -> %{http_code}\n' \
            http://localhost:8080/cms/page/edit
          # Split tags onto lines, find the one carrying _csrf, take its value. Attribute order
          # is not guaranteed, so match on the tag rather than on a fixed attribute sequence.
          CSRF=$(tr '>' '\n' < /tmp/form.html | grep '_csrf' | grep -o 'value="[^"]*"' | head -1 | cut -d'"' -f2)
          if [ -z "${CSRF}" ]; then
            echo "::error::no _csrf token in /cms/page/edit — cannot submit the form"
            grep -o '<title>[^<]*' /tmp/form.html | head -1
            exit 1
          fi
          echo "  _csrf token: ${#CSRF} chars"
          curl -s -b /tmp/jar -o /tmp/page.json -w '  POST /api (cms.page.save) -> %{http_code}\n' \
            -X POST http://localhost:8080/api \
            -H 'X-Requested-With: XMLHttpRequest' \
            --data-urlencode "_csrf=${CSRF}" \
            --data-urlencode "module=cms" --data-urlencode "service=page" --data-urlencode "method=save" \
            --data-urlencode "title=Smoke Test Page" --data-urlencode "slug=smoke-test" \
            --data-urlencode "type=page" --data-urlencode "format=html" \
            --data-urlencode "status=published" --data-urlencode "locale=en" \
            --data-urlencode "body=<h1>Created by the smoke test</h1>"
          echo "  body: $(head -c 300 /tmp/page.json)"
          if ! grep -q '"result":1' /tmp/page.json; then
            echo "::error::could not create a CMS page"; exit 1
          fi
          served=$(curl -s -o /tmp/served.html -w '%{http_code}' http://localhost:8080/smoke-test)
          echo "  GET /smoke-test -> HTTP ${served}"
          if [ "${served}" != "200" ] || ! grep -q "Created by the smoke test" /tmp/served.html; then
            echo "::error::the page saved but does not serve"
            echo "  what / serves         : $(curl -s http://localhost:8080/ | grep -o '<title>[^<]*' | head -1)"
            echo "  what /smoke-test serves: $(grep -o '<title>[^<]*' /tmp/served.html | head -1)"
            echo "  first 300 bytes of /smoke-test:"
            head -c 300 /tmp/served.html; echo
            echo "  active modules:"
            docker exec tiger-smoke bash -c "cd /var/www/tiger && runuser -u www-data -- php vendor/bin/tiger module:list 2>/dev/null | head -20" || true
            exit 1
          fi
          echo "PAGE OK — created through the API and serving"

          # Fetch every stylesheet and script the pages actually reference. Counting symlinks on disk
          # was the old check, and it passed an image that served NO CSS AT ALL: it counted _modules,
          # while _theme and _tiger — which is where every stylesheet lives — were never published.
          # A browser does not read the filesystem, so neither does this gate.
          echo "=== referenced assets are served ==="
          urls=$(for page in / /auth/login; do
                   curl -s "http://localhost:8080${page}"
                 done | grep -Eo '(href|src)="/_[^"]+"' | cut -d'"' -f2 | sort -u || true)
          [ -n "${urls}" ] || { echo "::error::no /_* assets referenced — the pages render without any"; exit 1; }
          bad=0; n=0
          for u in ${urls}; do
            n=$((n+1))
            # One field, split after the fact: `read` returns non-zero at EOF on output with no
            # trailing newline, and under the runner's `set -e` that alone would kill the step.
            got=$(curl -s -o /dev/null -w '%{http_code}|%{content_type}' "http://localhost:8080${u}")
            code=${got%%|*}; ctype=${got#*|}
            case "${code}:${ctype}" in
              200:text/css*|200:text/javascript*|200:application/javascript*|200:image/*|200:font/*|200:application/font*)
                ;;
              *)
                echo "  FAIL ${u} -> ${code} ${ctype}"; bad=$((bad+1)) ;;
            esac
          done
          echo "  ${n} referenced, $((n-bad)) served"
          [ "${bad}" -eq 0 ] || { echo "::error::${bad} of ${n} referenced assets do not serve"; exit 1; }

          # And they must be LINKED, not copied: with links an update is picked up for free; with
          # copies the browser keeps serving yesterday's asset and nobody notices for weeks.
          docker exec tiger-smoke bash -c '
            cd /var/www/tiger/public || exit 1
            miss=""
            for d in _tiger _theme _modules; do [ -e "$d" ] || miss="$miss $d"; done
            [ -z "$miss" ] || { echo "::error::not published:$miss"; exit 1; }
            total=0; links=0
            for e in _tiger _theme _modules/*; do
              [ -e "$e" ] || continue
              total=$((total+1)); [ -L "$e" ] && links=$((links+1))
            done
            echo "  entries: $total | symlinks: $links"
            [ "$links" -eq "$total" ] || { echo "::error::$((total-links)) published as copies, not links"; exit 1; }
          '
          echo "ASSETS OK — every referenced asset serves, and all are symlinks"


